name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Check, test & verify install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Svelte type & rule checks
        run: corepack pnpm check

      - name: Unit tests
        run: corepack pnpm test

      - name: Build npm package (svelte-package + publint)
        run: corepack pnpm package

      - name: Install the packed tarball into a fresh Svelte app and build it
        run: corepack pnpm test:install
